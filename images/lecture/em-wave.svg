<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Electric and magnetic fields in an electromagnetic wave</title>
  <desc id="desc">The wave travels in the positive x direction. Its electric field oscillates along y and its magnetic field along z, perpendicular to each other and to the direction of travel.</desc>
  <rect width="680" height="300" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#16324f">
    <text x="28" y="34" font-size="18" font-weight="700">Electromagnetic waves are transverse</text>
  </g>
  <line x1="70" y1="160" x2="610" y2="160" stroke="#16324f" stroke-width="2"/>
  <polygon points="610,160 596,153 596,167" fill="#16324f"/>
  <text x="615" y="165" font-family="Arial, sans-serif" font-size="15" fill="#16324f">x (travel)</text>
  <path d="M 90 160 C 120 160 130 80 160 80 S 200 240 230 240 S 270 80 300 80 S 340 240 370 240 S 410 80 440 80 S 480 240 510 240 S 550 80 580 80" fill="none" stroke="#b44b37" stroke-width="4"/>
  <path d="M 90 160 C 120 160 130 115 160 115 S 200 205 230 205 S 270 115 300 115 S 340 205 370 205 S 410 115 440 115 S 480 205 510 205 S 550 115 580 115" fill="none" stroke="#286b83" stroke-width="4"/>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <text x="450" y="72" fill="#b44b37">E along y</text>
    <text x="450" y="222" fill="#286b83">B along z</text>
  </g>
  <text x="70" y="276" font-family="Arial, sans-serif" font-size="14" fill="#526777">The fields are mutually perpendicular and perpendicular to the propagation direction.</text>
</svg>
